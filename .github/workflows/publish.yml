# Publishes the tool to nuget.org when a version tag such as v0.1.0 is pushed.
#
# It uses NuGet Trusted Publishing, so no API key is stored. The policy on nuget.org names this
# file, publish.yml, and the NUGET_USER repository secret holds the nuget.org profile name that
# owns the policy.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    # The tests have only been run on Windows so far.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet run --project tests/Ballast.Tests -c Release

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # let NuGet/login request a GitHub OIDC token
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check that the tag matches the package version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/Ballast.Cli/Ballast.Cli.fsproj)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in src/Ballast.Cli/Ballast.Cli.fsproj."
            exit 1
          fi

      - name: Pack
        run: dotnet pack src/Ballast.Cli -c Release -o nupkg

      # Exchanges the OIDC token for an API key that is valid for an hour, so it runs just before the push.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nupkg/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes
